<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Arial, sans-serif" font-size="13">
  <style>
    .title { font-size: 20px; font-weight: bold; fill: #1f3a8a; }
    .node  { fill: #eef2ff; stroke: #1f3a8a; stroke-width: 1.5; }
    .decision { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .start { fill: #16a34a; stroke: #166534; stroke-width: 1.5; }
    .end   { fill: #dc2626; stroke: #991b1b; stroke-width: 1.5; }
    .label { text-anchor: middle; fill: #0f172a; }
    .start-label, .end-label { text-anchor: middle; fill: #fff; font-weight: bold; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
    .arrow-text { fill: #64748b; font-size: 11px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">Flujo: Registro de lectura → Alerta → Reporte</text>

  <!-- Start -->
  <ellipse cx="450" cy="80" rx="60" ry="24" class="start" />
  <text x="450" y="85" class="start-label">Inicio</text>

  <!-- 1. Login -->
  <rect x="370" y="130" width="160" height="46" rx="6" class="node" />
  <text x="450" y="158" class="label">Usuario inicia sesión</text>

  <!-- 2. Sensor registra -->
  <rect x="370" y="200" width="160" height="46" rx="6" class="node" />
  <text x="450" y="222" class="label">Sensor envía lectura</text>
  <text x="450" y="238" class="label" font-size="10">POST /api/energy</text>

  <!-- 3. Guarda en Mongo -->
  <rect x="370" y="270" width="160" height="46" rx="6" class="node" />
  <text x="450" y="298" class="label">Guarda en MongoDB</text>

  <!-- 4. Decisión: ¿excede umbral? -->
  <polygon points="450,340 580,400 450,460 320,400" class="decision" />
  <text x="450" y="395" class="label">¿valor &gt; umbral?</text>
  <text x="450" y="412" class="label" font-size="10">(motor de reglas)</text>

  <!-- 5a. Genera alerta -->
  <rect x="600" y="380" width="160" height="46" rx="6" class="node" />
  <text x="680" y="402" class="label">Genera alerta</text>
  <text x="680" y="418" class="label" font-size="10">(crítica/advertencia)</text>

  <!-- 5b. Sin alerta -->
  <rect x="140" y="380" width="160" height="46" rx="6" class="node" />
  <text x="220" y="408" class="label">Continúa monitoreo</text>

  <!-- 6. Dashboard -->
  <rect x="370" y="490" width="160" height="46" rx="6" class="node" />
  <text x="450" y="512" class="label">Frontend consulta</text>
  <text x="450" y="528" class="label" font-size="10">GET /api/reports/metrics</text>

  <!-- 7. Render KPIs -->
  <rect x="370" y="560" width="160" height="46" rx="6" class="node" />
  <text x="450" y="588" class="label">Render KPIs + alertas</text>

  <!-- 8. Decisión: generar reporte -->
  <polygon points="450,630 560,675 450,720 340,675" class="decision" />
  <text x="450" y="678" class="label">¿generar reporte?</text>

  <!-- 9. Imprime / PDF -->
  <rect x="600" y="660" width="160" height="40" rx="6" class="end" />
  <text x="680" y="685" class="end-label">Imprimir / PDF</text>

  <!-- 10. Fin -->
  <ellipse cx="220" cy="680" rx="50" ry="20" class="end" />
  <text x="220" y="685" class="end-label">Fin</text>

  <!-- Conexiones -->
  <line x1="450" y1="104" x2="450" y2="130" class="arrow" />
  <line x1="450" y1="176" x2="450" y2="200" class="arrow" />
  <line x1="450" y1="246" x2="450" y2="270" class="arrow" />
  <line x1="450" y1="316" x2="450" y2="340" class="arrow" />

  <line x1="580" y1="400" x2="600" y2="400" class="arrow" />
  <text x="585" y="392" class="arrow-text">Sí</text>
  <line x1="320" y1="400" x2="300" y2="400" class="arrow" />
  <text x="305" y="392" class="arrow-text">No</text>

  <line x1="680" y1="426" x2="680" y2="455" class="arrow" />
  <line x1="680" y1="455" x2="510" y2="490" class="arrow" />
  <line x1="220" y1="426" x2="220" y2="455" class="arrow" />
  <line x1="220" y1="455" x2="390" y2="490" class="arrow" />

  <line x1="450" y1="536" x2="450" y2="560" class="arrow" />
  <line x1="450" y1="606" x2="450" y2="630" class="arrow" />

  <line x1="560" y1="675" x2="600" y2="680" class="arrow" />
  <text x="565" y="668" class="arrow-text">Sí</text>
  <line x1="340" y1="675" x2="270" y2="680" class="arrow" />
  <text x="295" y="668" class="arrow-text">No</text>
</svg>
