<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Arial, sans-serif" font-size="12">
  <style>
    .title { font-size: 20px; font-weight: bold; fill: #1f3a8a; }
    .collection { fill: #fff; stroke: #1f3a8a; stroke-width: 1.5; }
    .col-header { fill: #1f3a8a; }
    .col-name { fill: #fff; font-weight: bold; font-size: 14px; text-anchor: middle; }
    .field { fill: #0f172a; }
    .type  { fill: #64748b; font-style: italic; }
    .pk    { font-weight: bold; fill: #1f3a8a; }
    .rel   { stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .rel-label { fill: #b45309; font-size: 11px; font-weight: bold; }
  </style>

  <text x="500" y="30" text-anchor="middle" class="title">Modelo de Base de Datos - MongoDB (colecciones)</text>

  <!-- users -->
  <g>
    <rect x="40"  y="70"  width="220" height="170" class="collection" rx="6" />
    <rect x="40"  y="70"  width="220" height="28"  class="col-header" rx="6" />
    <text x="150" y="89"  class="col-name">users</text>
    <text x="55"  y="120" class="pk">_id</text>            <text x="170" y="120" class="type">ObjectId</text>
    <text x="55"  y="142" class="field">name</text>        <text x="170" y="142" class="type">String</text>
    <text x="55"  y="164" class="field">email</text>       <text x="170" y="164" class="type">String (unique)</text>
    <text x="55"  y="186" class="field">password</text>    <text x="170" y="186" class="type">String (hash)</text>
    <text x="55"  y="208" class="field">role</text>        <text x="170" y="208" class="type">enum</text>
    <text x="55"  y="230" class="field">plant</text>       <text x="170" y="230" class="type">String</text>
  </g>

  <!-- energy_readings -->
  <g>
    <rect x="380" y="70"  width="240" height="200" class="collection" rx="6" />
    <rect x="380" y="70"  width="240" height="28"  class="col-header" rx="6" />
    <text x="500" y="89"  class="col-name">energy_readings</text>
    <text x="395" y="120" class="pk">_id</text>            <text x="520" y="120" class="type">ObjectId</text>
    <text x="395" y="142" class="field">sensor_id</text>   <text x="520" y="142" class="type">String</text>
    <text x="395" y="164" class="field">area</text>        <text x="520" y="164" class="type">String</text>
    <text x="395" y="186" class="field">value_kwh</text>   <text x="520" y="186" class="type">Number</text>
    <text x="395" y="208" class="field">threshold</text>   <text x="520" y="208" class="type">Number</text>
    <text x="395" y="230" class="field">source</text>      <text x="520" y="230" class="type">enum sensor|manual</text>
    <text x="395" y="252" class="field">timestamp</text>   <text x="520" y="252" class="type">Date (indexed)</text>
  </g>

  <!-- water_readings -->
  <g>
    <rect x="730" y="70"  width="240" height="200" class="collection" rx="6" />
    <rect x="730" y="70"  width="240" height="28"  class="col-header" rx="6" />
    <text x="850" y="89"  class="col-name">water_readings</text>
    <text x="745" y="120" class="pk">_id</text>            <text x="870" y="120" class="type">ObjectId</text>
    <text x="745" y="142" class="field">sensor_id</text>   <text x="870" y="142" class="type">String</text>
    <text x="745" y="164" class="field">area</text>        <text x="870" y="164" class="type">String</text>
    <text x="745" y="186" class="field">value_m3</text>    <text x="870" y="186" class="type">Number</text>
    <text x="745" y="208" class="field">ph</text>          <text x="870" y="208" class="type">Number</text>
    <text x="745" y="230" class="field">threshold_m3</text><text x="870" y="230" class="type">Number</text>
    <text x="745" y="252" class="field">timestamp</text>   <text x="870" y="252" class="type">Date (indexed)</text>
  </g>

  <!-- alerts -->
  <g>
    <rect x="200" y="370" width="260" height="210" class="collection" rx="6" />
    <rect x="200" y="370" width="260" height="28"  class="col-header" rx="6" />
    <text x="330" y="389" class="col-name">alerts</text>
    <text x="215" y="420" class="pk">_id</text>            <text x="350" y="420" class="type">ObjectId</text>
    <text x="215" y="442" class="field">type</text>        <text x="350" y="442" class="type">enum energia/agua/ph/normativa</text>
    <text x="215" y="464" class="field">severity</text>    <text x="350" y="464" class="type">enum critica/advertencia/info</text>
    <text x="215" y="486" class="field">message</text>     <text x="350" y="486" class="type">String</text>
    <text x="215" y="508" class="field">area</text>        <text x="350" y="508" class="type">String</text>
    <text x="215" y="530" class="field">value</text>       <text x="350" y="530" class="type">Number</text>
    <text x="215" y="552" class="field">threshold</text>   <text x="350" y="552" class="type">Number</text>
    <text x="215" y="574" class="field">acknowledged</text><text x="350" y="574" class="type">Boolean</text>
  </g>

  <!-- obligations -->
  <g>
    <rect x="570" y="370" width="260" height="200" class="collection" rx="6" />
    <rect x="570" y="370" width="260" height="28"  class="col-header" rx="6" />
    <text x="700" y="389" class="col-name">obligations</text>
    <text x="585" y="420" class="pk">_id</text>            <text x="720" y="420" class="type">ObjectId</text>
    <text x="585" y="442" class="field">title</text>       <text x="720" y="442" class="type">String</text>
    <text x="585" y="464" class="field">entity</text>      <text x="720" y="464" class="type">enum SEMARNAT/PROFEPA/CONUEE</text>
    <text x="585" y="486" class="field">description</text> <text x="720" y="486" class="type">String</text>
    <text x="585" y="508" class="field">due_date</text>    <text x="720" y="508" class="type">Date</text>
    <text x="585" y="530" class="field">evidence_url</text><text x="720" y="530" class="type">String (nullable)</text>
    <text x="585" y="552" class="field">status</text>      <text x="720" y="552" class="type">enum compliant/at_risk/overdue</text>
  </g>

  <!-- Relaciones (lógicas) -->
  <path d="M 500 270 Q 450 320 380 400" class="rel" />
  <text x="430" y="335" class="rel-label">genera (si excede umbral)</text>

  <path d="M 800 270 Q 700 320 460 420" class="rel" />
  <text x="700" y="335" class="rel-label">genera (pH/umbral)</text>

  <text x="500" y="630" text-anchor="middle" class="rel-label">Las colecciones de readings disparan documentos en alerts vía el motor de reglas (engine.js).</text>
</svg>
